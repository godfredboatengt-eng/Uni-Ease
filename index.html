<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102d46">
<meta name="description" content="uniEase brings UCC students affordable campus shopping, a student marketplace, peer tutoring, skills, printing and essentials in one place.">
<title>uniEase — Your campus, made easier</title>
<style>
:root{--navy:#102d46;--navy2:#173d5c;--teal:#13a887;--mint:#e8f7f2;--ink:#182b3a;--muted:#718096;--line:#e7edf1;--bg:#f5f8fa;--white:#fff;--gold:#f2b84b;--shadow:0 12px 32px rgba(16,45,70,.08);--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1200px)/2));position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:21px;color:var(--navy);letter-spacing:-.6px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#e4f3ee;color:#087d63;display:grid;place-items:center;font-weight:800}.layout{max-width:1200px;margin:auto;padding:26px 22px 90px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px}.sidebar{align-self:start;position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 16px rgba(16,45,70,.03)}.side-label{font-size:10px;letter-spacing:1.3px;color:#9aa7b1;font-weight:800;padding:10px 12px 8px}.navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;background:transparent;color:#5c6c79;text-align:left;border-radius:12px;font-weight:650;margin:2px 0}.navbtn:hover,.navbtn.active{background:#eaf7f3;color:#087e64}.navico{font-size:18px;width:22px;text-align:center}.side-note{margin:16px 5px 4px;background:#f2f7fa;border-radius:14px;padding:13px;font-size:12px;color:#687987}.main{min-width:0}.welcome{background:linear-gradient(120deg,#102d46,#1c5570);border-radius:24px;color:#fff;padding:28px 30px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.welcome:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;border:42px solid rgba(255,255,255,.07);right:-60px;top:-110px}.welcome h1{font-size:29px;line-height:1.2;margin:8px 0}.welcome p{color:#c8d9e4;margin:0;max-width:520px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;color:#8dd9c4}.searchbar{margin-top:22px;background:#fff;border-radius:13px;padding:0 14px;display:flex;align-items:center;gap:10px;max-width:600px}.searchbar input{border:0;outline:0;padding:14px 0;width:100%;color:var(--ink)}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:28px 0 14px}.sectionhead h2{margin:0;font-size:19px;letter-spacing:-.3px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.textbtn{color:#07866a;background:transparent;font-weight:750}.services{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.service{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px 13px;text-align:left;transition:.18s;min-height:130px}.service:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c5e8dd}.service .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;margin-bottom:12px}.service b{display:block;font-size:13px}.service small{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.product-img{height:145px;background:linear-gradient(135deg,#e8f1f5,#d7e9e3);display:grid;place-items:center;font-size:48px;position:relative}.product-img img{width:100%;height:100%;object-fit:cover}.pill{position:absolute;top:10px;left:10px;background:#fff;border-radius:30px;padding:4px 9px;font-size:10px;font-weight:800;color:#087e64}.product-body{padding:13px}.product-body h3{font-size:14px;margin:0 0 4px}.muted{color:var(--muted);font-size:12px}.price{font-size:16px;font-weight:850;color:var(--navy);margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border-radius:11px;padding:10px 15px;font-weight:750;background:var(--navy);color:#fff}.btn:hover{background:#1c4b6d}.btn.teal{background:var(--teal)}.btn.light{background:#eaf7f3;color:#087e64}.btn.outline{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.small{font-size:12px;padding:8px 11px}.btn:disabled{opacity:.45;cursor:not-allowed}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 4px 16px rgba(16,45,70,.025)}.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.page-title h1{margin:0;font-size:25px;letter-spacing:-.6px}.page-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;color:#62717e;border-radius:30px;padding:8px 13px;font-size:12px;font-weight:700}.tab.active{background:#eaf7f3;color:#087e64;border-color:#ccebe1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#425563}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe7ec;border-radius:11px;padding:11px 12px;outline:0;background:#fff;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#54bda1;box-shadow:0 0 0 3px #e7f7f2}.upload{border:1.5px dashed #a9d8ca;border-radius:14px;padding:18px;text-align:center;background:#f7fcfa;color:#598173}.upload input{max-width:100%;margin-top:10px}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview img{width:70px;height:65px;object-fit:cover;border-radius:9px}.empty{padding:36px 15px;text-align:center;color:var(--muted)}.empty .big{font-size:38px}.notice{padding:12px 14px;border-radius:12px;background:#fff7e6;color:#805d19;font-size:12px;margin:12px 0}.success{padding:12px 14px;border-radius:12px;background:#eaf7f1;color:#087e64;font-size:13px;margin:12px 0}.servicehero{padding:21px;border-radius:17px;background:#f0f8f6;margin-bottom:16px;display:flex;align-items:center;gap:16px}.servicehero .bigico{font-size:35px}.servicehero h2{margin:0;font-size:18px}.servicehero p{margin:3px 0 0;color:var(--muted);font-size:12px}.listrow{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.thumb{width:58px;height:58px;border-radius:12px;background:#edf4f6;display:grid;place-items:center;font-size:25px;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.listrow .details{flex:1;min-width:0}.details b{display:block;font-size:13px}.footer{text-align:center;color:#91a0aa;font-size:11px;padding:24px 0}.mobile-nav{display:none}.modalback{position:fixed;inset:0;background:rgba(8,25,38,.45);z-index:60;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:20px}.close{background:#f1f4f6;border-radius:50%;width:32px;height:32px;font-size:18px}.hidden{display:none!important}.cartcount{background:#eaf7f3;color:#087e64;border-radius:30px;padding:2px 7px;font-size:10px}.tag{display:inline-block;background:#f1f5f7;color:#617381;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:700}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:18px 16px 90px}.sidebar{display:none}.services{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 16px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}.mobile-nav button{background:transparent;color:#6b7b87;font-size:10px;display:grid;justify-items:center;gap:3px}.mobile-nav button.active{color:#07866a}.mobile-nav span{font-size:19px}.welcome{padding:24px}.welcome h1{font-size:25px}}
@media(max-width:560px){.services{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr;gap:9px}.product-img{height:112px}.product-body{padding:10px}.product-body h3{font-size:12px}.price{font-size:14px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-title{align-items:flex-start}.page-title h1{font-size:22px}.hide-mobile{display:none}.welcome{border-radius:19px}.service{min-height:118px}.sectionhead{margin-top:23px}}
</style></head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brandmark">u</div>uniEase</div>
  <div class="top-actions"><button class="btn light small" onclick="showCart()">🛒 Cart <span id="cartCount" class="cartcount">0</span></button><button class="avatar" onclick="openAuth()" id="avatar">G</button></div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="side-label">CAMPUS</div>
  <button class="navbtn active" data-page="home"><span class="navico">⌂</span>Overview</button>
  <button class="navbtn" data-page="china"><span class="navico">🛍️</span>China Shopping</button>
  <button class="navbtn" data-page="market"><span class="navico">♧</span>Student Marketplace</button>
  <button class="navbtn" data-page="skills"><span class="navico">✦</span>Skills & Tutors</button>
  <button class="navbtn" data-page="printing"><span class="navico">▤</span>Smart Printing</button>
  <button class="navbtn" data-page="health"><span class="navico">♡</span>Health & Essentials</button>
  <div class="side-label">YOUR SPACE</div>
  <button class="navbtn" data-page="orders"><span class="navico">▣</span>My orders & bookings</button>
  <button class="navbtn" data-page="profile"><span class="navico">◉</span>My profile</button>
  <div class="side-note"><b>Made for UCC students</b><br>Discover campus services, support student businesses and make everyday life easier.</div>
</aside>
<main class="main" id="main"></main>
</div>
<nav class="mobile-nav">
<button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="market"><span>♧</span>Market</button><button data-page="printing"><span>▤</span>Print</button><button data-page="orders"><span>▣</span>Orders</button><button data-page="profile"><span>◉</span>Profile</button>
</nav>
</div>
<div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s);
const state={page:'home',user:JSON.parse(localStorage.getItem('unieaseUser')||'null'),cart:[],orders:JSON.parse(localStorage.getItem('unieaseOrders')||'[]'),listings:JSON.parse(localStorage.getItem('unieaseListings')||'null'),providers:JSON.parse(localStorage.getItem('unieaseProviders')||'[]'),filter:'All',search:''};
const sample=[
{id:1,cat:'Books',title:'Introduction to Sociology textbook',price:45,owner:'Ama • Valco Hall',emoji:'📚',condition:'Good condition'},
{id:2,cat:'Furniture',title:'Study table — compact size',price:120,owner:'Kojo • Atlantic Hall',emoji:'🪑',condition:'Pre-owned'},
{id:3,cat:'Electronics',title:'Rechargeable desk lamp',price:65,owner:'Esi • Casford Hall',emoji:'💡',condition:'Like new'},
{id:4,cat:'Stationery',title:'Scientific calculator',price:55,owner:'Yaw • Oguaa Hall',emoji:'🧮',condition:'Very good'},
{id:5,cat:'Books',title:'Microeconomics course book',price:38,owner:'Nana • Valco Hall',emoji:'📖',condition:'Good condition'},
{id:6,cat:'Appliances',title:'Electric kettle',price:85,owner:'Akua • Atlantic Hall',emoji:'🫖',condition:'Pre-owned'}
];
const tutors=[
{title:'Level 200 Statistics tutoring',kind:'Academic support',price:25,unit:'/ hour',person:'Michael A.',emoji:'📊',desc:'Patient peer tutor • Online or on campus'},
{title:'Knotless braids',kind:'Hair & beauty',price:100,unit:'from',person:'Abena B.',emoji:'💇🏽‍♀️',desc:'Neat protective styles • Book a slot'},
{title:'Graphic design & flyers',kind:'Creative',price:35,unit:'from',person:'Kobby D.',emoji:'🎨',desc:'Posters, logos and social media designs'},
{title:'Mathematics peer lessons',kind:'Academic support',price:20,unit:'/ hour',person:'Sandra K.',emoji:'✏️',desc:'One-on-one revision and exam preparation'},
{title:'Gel nails',kind:'Hair & beauty',price:70,unit:'from',person:'Mavis N.',emoji:'💅🏽',desc:'Simple, clean nail sets by appointment'},
{title:'Crochet bags & tops',kind:'Creative',price:60,unit:'from',person:'Efua T.',emoji:'🧶',desc:'Custom handmade pieces'}
];
const china=[
{title:'Wireless earbuds',price:95,emoji:'🎧',desc:'Bluetooth • Estimated landed price'},
{title:'Mini desk fan',price:78,emoji:'🌀',desc:'USB rechargeable • Estimated landed price'},
{title:'Campus backpack',price:110,emoji:'🎒',desc:'Everyday carry • Estimated landed price'},
{title:'Smart watch',price:145,emoji:'⌚',desc:'Fitness and notifications • Estimated landed price'}
];
function money(n){return 'GH₵ '+Number(n).toFixed(2)}
function nav(page){state.page=page;state.filter='All';state.search='';render();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function persist(){localStorage.setItem('unieaseOrders',JSON.stringify(state.orders));localStorage.setItem('unieaseListings',JSON.stringify(state.listings||sample));localStorage.setItem('unieaseProviders',JSON.stringify(state.providers));localStorage.setItem('unieaseUser',JSON.stringify(state.user))}
function count(){ $('#cartCount').textContent=state.cart.length}
function addCart(item){state.cart.push(item);count();toast('Added to your cart');}
function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style='position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#102d46;color:white;padding:12px 18px;border-radius:12px;z-index:90;box-shadow:0 8px 24px #102d4633;font-size:13px';document.body.append(t);setTimeout(()=>t.remove(),2200)}
function card(item,kind='market'){return `<article class="product"><div class="product-img">${item.image?`<img src="${item.image}" alt="${item.title.replace(/"/g,'&quot;')}" loading="lazy">`:`<span>${item.emoji||'📦'}</span>`}<span class="pill">${item.cat||item.kind||'Student pick'}</span></div><div class="product-body"><h3>${item.title}</h3><div class="muted">${item.owner||item.person||item.desc||''}</div><div class="price">${money(item.price)} <small class="muted">${item.unit||''}</small></div><div class="row"><span class="muted">${item.condition||'Student service'}</span><button class="btn small" onclick="${kind==='skills'?`bookService('${item.title.replace(/'/g,"\\'")}',${item.price})`:`addCart(${JSON.stringify(item).replace(/"/g,'&quot;')})`}">${kind==='skills'?'Book':'Add'}</button></div></div></article>`}
function home(){return `<section class="welcome"><div class="eyebrow">YOUR CAMPUS. YOUR COMMUNITY.</div><h1>Make student life<br>feel a little easier.</h1><p>Shop, learn, sell, book and get essentials — all in one place, built around UCC students.</p><div class="searchbar"><span>⌕</span><input id="globalSearch" placeholder="Search products, services, tutors..." onkeydown="if(event.key==='Enter')searchAll(this.value)"><button class="btn teal small" onclick="searchAll($('#globalSearch').value)">Search</button></div></section>
<div class="sectionhead"><div><h2>Explore uniEase</h2><div class="sub">Five services. One student community.</div></div></div>
<div class="services">
<button class="service" onclick="nav('china')"><div class="ico" style="background:#eaf3ff">🛍️</div><b>China Shopping</b><small>Order products from China</small></button>
<button class="service" onclick="nav('market')"><div class="ico" style="background:#fff3df">♧</div><b>Student Marketplace</b><small>Buy & sell pre-loved items</small></button>
<button class="service" onclick="nav('skills')"><div class="ico" style="background:#e8f7f2">✦</div><b>Skills & Tutors</b><small>Learn from student talent</small></button>
<button class="service" onclick="nav('printing')"><div class="ico" style="background:#f0edff">▤</div><b>Smart Printing</b><small>Book before you arrive</small></button>
<button class="service" onclick="nav('health')"><div class="ico" style="background:#fff0f2">♡</div><b>Health & Essentials</b><small>Private, convenient access</small></button>
</div>
<div class="sectionhead"><div><h2>Popular around campus</h2><div class="sub">Affordable finds from fellow students</div></div><button class="textbtn" onclick="nav('market')">View marketplace →</button></div>
<div class="grid">${sample.slice(0,3).map(x=>card(x)).join('')}</div>
<div class="sectionhead"><div><h2>Earn with your skills</h2><div class="sub">Student talent deserves a platform.</div></div><button class="textbtn" onclick="nav('skills')">Explore services →</button></div><div class="grid">${tutors.slice(0,3).map(x=>card(x,'skills')).join('')}</div>`}
function pageHead(title,desc,button=''){return `<div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function marketPage(){let items=state.listings||sample;let cats=['All','Books','Stationery','Furniture','Electronics','Appliances'];let filtered=items.filter(x=>(state.filter==='All'||x.cat===state.filter)&&(`${x.title} ${x.owner||''}`).toLowerCase().includes(state.search.toLowerCase()));return `${pageHead('Student Marketplace','Give useful items a second life. Buy affordable essentials from fellow UCC students.',`<button class="btn teal" onclick="openListing()">＋ Sell an item</button>`)}<div class="panel"><div class="row"><div><b>Browse listings</b><div class="sub">Student-to-student buying and selling</div></div><input style="max-width:220px;border:1px solid var(--line);border-radius:10px;padding:9px" placeholder="Search listings..." oninput="state.search=this.value;renderContent()" value="${state.search}"></div><div class="tabs">${cats.map(c=>`<button class="tab ${state.filter===c?'active':''}" onclick="state.filter='${c}';render()">${c}</button>`).join('')}</div><div class="grid" id="listingGrid">${filtered.map(x=>card(x)).join('')||'<div class="empty">No listings match your search yet.</div>'}</div></div>`}
function skillsPage(){return `${pageHead('Skills & Tutors','Find affordable academic help and student-run services.',`<button class="btn teal" onclick="openProvider()">＋ Offer a service</button>`)}<div class="servicehero"><div class="bigico">🎓</div><div><h2>Learn something. Share something.</h2><p>Connect with talented students for tutoring, beauty, grooming and creative services.</p></div></div><div class="tabs">${['All','Academic support','Hair & beauty','Creative'].map(c=>`<button class="tab ${state.filter===c?'active':''}" onclick="state.filter='${c}';render()">${c}</button>`).join('')}</div><div class="grid">${[...state.providers,...tutors].filter(x=>state.filter==='All'||x.kind===state.filter).map(x=>card(x,'skills')).join('')}</div>`}
function chinaPage(){return `${pageHead('China Shopping','Discover products and submit requests for assisted purchasing.') }<div class="servicehero"><div class="bigico">📦</div><div><h2>From China to your campus</h2><p>Request products, review an estimated landed price and follow the order journey.</p></div></div><div class="notice">Prototype pricing is illustrative only. Real shipping, customs and delivery costs must be confirmed before payment.</div><div class="sectionhead"><div><h2>Featured products</h2><div class="sub">Popular picks students may want</div></div><button class="btn teal small" onclick="openChinaRequest()">＋ Request a product</button></div><div class="grid">${china.map(x=>card(x)).join('')}</div><div class="panel" style="margin-top:18px"><h3 style="margin:0 0 6px">How assisted ordering works</h3><div class="listrow"><div class="thumb">1</div><div class="details"><b>Share the product link or photo</b><span class="muted">Tell us what you want to purchase.</span></div></div><div class="listrow"><div class="thumb">2</div><div class="details"><b>Review the final quote</b><span class="muted">Confirm item price, shipping and estimated delivery.</span></div></div><div class="listrow"><div class="thumb">3</div><div class="details"><b>Track and collect</b><span class="muted">Get updates until your product reaches campus.</span></div></div></div>`}
function printingPage(){return `${pageHead('Smart Printing','Skip the queue around Science Market. Send your files and book a collection time.') }<div class="servicehero"><div class="bigico">🖨️</div><div><h2>Print first. Pick up later.</h2><p>Upload documents, choose print settings and reserve a collection slot.</p></div></div><div class="panel"><h3 style="margin:0 0 16px">Create a printing request</h3><div class="formgrid"><div class="field full"><label>Upload document (PDF, DOC or image)</label><div class="upload">📎 Select your assignment or document<input type="file" id="printFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></div></div><div class="field"><label>Printing service</label><select id="printType"><option>Black & white printing</option><option>Colour printing</option><option>Photocopying</option><option>Typing</option><option>Book binding</option><option>Past questions</option></select></div><div class="field"><label>Number of copies</label><input id="copies" type="number" min="1" value="1"></div><div class="field"><label>Print format</label><select id="printFormat"><option>Single-sided</option><option>Double-sided</option></select></div><div class="field"><label>Paper size</label><select id="paper"><option>A4</option><option>A3</option></select></div><div class="field"><label>Preferred collection date</label><input type="date" id="printDate"></div><div class="field"><label>Collection time</label><select id="printTime"><option>09:00 – 10:00</option><option>10:00 – 11:00</option><option>11:00 – 12:00</option><option>12:00 – 13:00</option><option>14:00 – 15:00</option><option>15:00 – 16:00</option></select></div><div class="field full"><label>Special instructions</label><textarea id="printNotes" rows="2" placeholder="e.g. Bind with blue cover, staple top-left..."></textarea></div></div><div class="notice">The print shop will confirm the final price and readiness. Do not upload confidential documents in this demo.</div><button class="btn teal" onclick="submitPrinting()">Submit printing request →</button></div>`}
function healthPage(){return `${pageHead('Health & Essentials','Personal care, pharmacy essentials and trusted health support.') }<div class="servicehero"><div class="bigico">💚</div><div><h2>Your wellbeing matters.</h2><p>Convenient access to everyday essentials with privacy and dignity.</p></div></div><div class="notice">Health services in this prototype are illustrative. Pharmacy fulfilment and consultations require approved, licensed providers and UCC Hospital arrangements.</div><div class="sectionhead"><div><h2>Everyday essentials</h2><div class="sub">Discreet ordering with delivery options</div></div></div><div class="grid">${[{title:'Sanitary pads',price:18,emoji:'🌸',desc:'Regular flow • sample pack'},{title:'Condoms',price:15,emoji:'🛡️',desc:'Barrier protection • sample pack'},{title:'Personal care kit',price:35,emoji:'🧴',desc:'Everyday hygiene essentials'},{title:'Pregnancy test kit',price:25,emoji:'🧪',desc:'Home testing • follow instructions'}].map(x=>card({...x,cat:'Essentials'})).join('')}</div><div class="panel" style="margin-top:18px"><h3 style="margin-top:0">Speak with a health professional</h3><p class="muted">Request a confidential appointment through an approved UCC Hospital channel. This demo does not provide medical advice or create a real appointment.</p><div class="formgrid"><div class="field"><label>Preferred consultation</label><select id="consultType"><option>General health enquiry</option><option>Sexual and reproductive health</option><option>Menstrual health</option><option>Pharmacy guidance</option></select></div><div class="field"><label>Preferred date</label><input id="consultDate" type="date"></div><div class="field full"><label>Optional note (avoid sensitive details)</label><textarea id="consultNote" rows="2" placeholder="Briefly describe the type of support you need"></textarea></div></div><button class="btn teal" style="margin-top:13px" onclick="submitConsult()">Request consultation</button></div>`}
function ordersPage(){return `${pageHead('My orders & bookings','Keep track of purchases, service bookings and campus requests.')}<div class="panel">${state.orders.length?state.orders.slice().reverse().map(o=>`<div class="listrow"><div class="thumb">${o.icon||'📦'}</div><div class="details"><b>${o.title}</b><span class="muted">${o.date} • ${o.status||'Request received'} • ${o.method||'Awaiting confirmation'}</span></div><b>${o.price?money(o.price):''}</b></div>`).join(''):'<div class="empty"><div class="big">🧾</div><b>No orders yet</b><p>Your purchases and bookings will appear here.</p><button class="btn teal" onclick="nav(\'market\')">Explore marketplace</button></div>'}</div>`}
function profilePage(){return `${pageHead('My profile','Manage your student details and account preferences.')}<div class="panel"><div class="row" style="justify-content:flex-start;margin-bottom:20px"><div class="avatar" style="width:58px;height:58px;font-size:22px">${state.user?(state.user.name||'S').charAt(0).toUpperCase():'G'}</div><div><b>${state.user?.name||'Guest student'}</b><div class="muted">${state.user?.phone||'Sign in to personalise your account'}</div></div></div>${state.user?`<div class="listrow"><div class="details"><b>Student ID</b><span class="muted">${state.user.studentId||'Not provided'}</span></div></div><div class="listrow"><div class="details"><b>Programme</b><span class="muted">${state.user.programme||'Not provided'}</span></div></div><button class="btn outline" onclick="logout()">Sign out</button>`:`<p class="muted">Create a demo profile to personalise your uniEase experience.</p><button class="btn teal" onclick="openAuth()">Create account / Sign in</button>`}</div><div class="panel" style="margin-top:15px"><b>About uniEase</b><p class="muted">A student integrative service platform concept for the University of Cape Coast.</p><span class="tag">Prototype v0.1</span></div>`}
function renderContent(){let m=$('#listingGrid');if(!m)return;let items=(state.listings||sample).filter(x=>(state.filter==='All'||x.cat===state.filter)&&(`${x.title} ${x.owner||''}`).toLowerCase().includes(state.search.toLowerCase()));m.innerHTML=items.map(x=>card(x)).join('')||'<div class="empty">No matching listings.</div>'}
function render(){let pages={home,china:chinaPage,market:marketPage,skills:skillsPage,printing:printingPage,health:healthPage,orders:ordersPage,profile:profilePage};$('#main').innerHTML=(pages[state.page]||home)()+`<div class="footer">© 2026 uniEase · Built for UCC students · Prototype experience</div>`;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));}
function searchAll(q){let s=q.toLowerCase();if(sample.some(x=>x.title.toLowerCase().includes(s))){state.page='market';state.search=q;render();}else if(tutors.some(x=>x.title.toLowerCase().includes(s))){state.page='skills';render();}else{state.page='market';state.search=q;render();}}
function modal(content){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${content.title}</h2><button class="close" onclick="closeModal()">×</button></div>${content.body}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function openAuth(){modal({title:'Welcome to uniEase',body:`<p class="muted">Create a demo student profile. This prototype stores details only in this browser.</p><div class="formgrid"><div class="field full"><label>Full name</label><input id="authName" placeholder="Your full name" value="${state.user?.name||''}"></div><div class="field full"><label>Telephone number</label><input id="authPhone" placeholder="+233 XX XXX XXXX" value="${state.user?.phone||''}"></div><div class="field"><label>UCC Student ID</label><input id="authId" placeholder="Student ID" value="${state.user?.studentId||''}"></div><div class="field"><label>Programme</label><input id="authProgramme" placeholder="Programme" value="${state.user?.programme||''}"></div></div><div class="notice">Demo only: no OTP or real identity verification is performed.</div><button class="btn teal" onclick="saveAuth()">Continue to uniEase</button>`})}
function saveAuth(){let name=$('#authName').value.trim(),phone=$('#authPhone').value.trim();if(!name||!phone){toast('Please enter your name and phone number');return}state.user={name,phone,studentId:$('#authId').value,programme:$('#authProgramme').value};persist();$('#avatar').textContent=name[0].toUpperCase();closeModal();toast('Welcome to uniEase, '+name.split(' ')[0]+'!');render()}
function logout(){state.user=null;persist();$('#avatar').textContent='G';render();toast('Signed out')}
function openListing(){modal({title:'List an item for sale',body:`<div class="formgrid"><div class="field full"><label>Item name</label><input id="liTitle" placeholder="e.g. Used course textbook"></div><div class="field"><label>Category</label><select id="liCat"><option>Books</option><option>Stationery</option><option>Furniture</option><option>Electronics</option><option>Appliances</option></select></div><div class="field"><label>Price (GH₵)</label><input id="liPrice" type="number" min="1" placeholder="45"></div><div class="field full"><label>Condition and description</label><textarea id="liDesc" rows="2" placeholder="Describe condition, collection location..."></textarea></div><div class="field full"><label>Upload photos</label><input type="file" id="liPhoto" accept="image/*" multiple></div></div><button class="btn teal" style="margin-top:14px" onclick="saveListing()">Publish listing</button>`})}
function saveListing(){let title=$('#liTitle').value.trim(),price=Number($('#liPrice').value);if(!title||!price){toast('Add an item name and price');return}let f=$('#liPhoto').files[0],item={id:Date.now(),title,price,cat:$('#liCat').value,owner:(state.user?.name||'UCC student')+' • UCC',emoji:'📦',condition:$('#liDesc').value||'Student listing'};if(f){if(f.size>2*1024*1024){toast('Please choose an image under 2 MB');return}let reader=new FileReader();reader.onload=()=>{item.image=reader.result;finishListing(item)};reader.readAsDataURL(f)}else finishListing(item)}
function finishListing(item){state.listings=state.listings||sample;state.listings.unshift(item);persist();closeModal();nav('market');toast('Your listing is live in this demo')}
function openProvider(){modal({title:'Offer a student service',body:`<div class="formgrid"><div class="field full"><label>Service title</label><input id="prTitle" placeholder="e.g. Level 200 Economics tutoring"></div><div class="field"><label>Category</label><select id="prCat"><option>Academic support</option><option>Hair & beauty</option><option>Creative</option></select></div><div class="field"><label>Starting price (GH₵)</label><input id="prPrice" type="number" placeholder="25"></div><div class="field full"><label>About your service</label><textarea id="prDesc" rows="2" placeholder="What do you offer?"></textarea></div><div class="field full"><label>Upload a service photo (optional)</label><input type="file" id="prPhoto" accept="image/*"></div></div><button class="btn teal" style="margin-top:14px" onclick="saveProvider()">Publish service</button>`})}
function saveProvider(){let title=$('#prTitle').value.trim(),price=Number($('#prPrice').value);if(!title||!price){toast('Add a service title and price');return}let item={title,price,kind:$('#prCat').value,person:state.user?.name||'UCC student',emoji:'✨',desc:$('#prDesc').value,unit:'from'};let f=$('#prPhoto').files[0];if(f){if(f.size>2*1024*1024){toast('Please choose an image under 2 MB');return}let reader=new FileReader();reader.onload=()=>{item.image=reader.result;state.providers.unshift(item);persist();closeModal();nav('skills');toast('Your service is now listed in this demo')};reader.readAsDataURL(f)}else{state.providers.unshift(item);persist();closeModal();nav('skills');toast('Your service is now listed in this demo')}}
function bookService(title,price){modal({title:'Book a service',body:`<p><b>${title}</b></p><p class="price">${money(price)}</p><div class="formgrid"><div class="field"><label>Preferred date</label><input id="bookDate" type="date"></div><div class="field"><label>Preferred time</label><input id="bookTime" type="time"></div><div class="field full"><label>Message to provider</label><textarea id="bookNote" rows="2" placeholder="Share any useful details"></textarea></div></div><button class="btn teal" style="margin-top:14px" onclick="createOrder('${title.replace(/'/g,"\\'")}',${price},'Booking requested','📅')">Request booking</button>`})}
function openChinaRequest(){modal({title:'Request a product from China',body:`<div class="formgrid"><div class="field full"><label>Product name or link</label><input id="chName" placeholder="Paste a product link or name"></div><div class="field"><label>Estimated budget (GH₵)</label><input id="chBudget" type="number" placeholder="150"></div><div class="field"><label>Quantity</label><input id="chQty" type="number" value="1" min="1"></div><div class="field full"><label>Upload product picture</label><input id="chPhoto" type="file" accept="image/*"></div><div class="field full"><label>Additional details</label><textarea id="chNote" rows="2" placeholder="Colour, size, preferred seller..."></textarea></div></div><div class="notice">This creates a request only. A verified quote is needed before any payment.</div><button class="btn teal" onclick="submitChina()">Send product request</button>`})}
function submitChina(){let title=$('#chName').value.trim();if(!title){toast('Enter a product name or link');return}createOrder('China order request: '+title,Number($('#chBudget').value)||0,'Quote requested','📦');}
function submitPrinting(){let file=$('#printFile').files[0],type=$('#printType').value;if(!file){toast('Please choose a document first');return}createOrder(type+' ('+file.name+')',0,'Submitted for print-shop confirmation','🖨️');}
function submitConsult(){createOrder('Health consultation request: '+$('#consultType').value,0,'Demo request — not sent to a provider','💚');toast('Demo request saved locally')}
function createOrder(title,price,status,icon){state.orders.push({title,price,status,icon,date:new Date().toLocaleDateString(),method:'Awaiting confirmation'});persist();closeModal();if(state.page!=='orders')nav('orders');else render();toast('Request saved in this demo')}
function showCart(){let body=state.cart.length?`<div>${state.cart.map((x,i)=>`<div class="listrow"><div class="thumb">${x.emoji||'📦'}</div><div class="details"><b>${x.title}</b><span class="muted">${money(x.price)}</span></div><button class="btn outline small" onclick="removeCart(${i})">Remove</button></div>`).join('')}</div><div class="row" style="margin:15px 0"><b>Total</b><b>${money(state.cart.reduce((a,x)=>a+Number(x.price),0))}</b></div><button class="btn teal" onclick="checkout()">Continue to checkout</button>`:'<div class="empty"><div class="big">🛒</div><b>Your cart is empty</b><p>Add a product or item to get started.</p></div>';modal({title:'Your cart',body})}
function removeCart(i){state.cart.splice(i,1);count();showCart()}
function checkout(){let total=state.cart.reduce((a,x)=>a+Number(x.price),0);modal({title:'Checkout',body:`<div class="row"><span class="muted">Order total</span><b class="price">${money(total)}</b></div><div class="field" style="margin-top:14px"><label>Delivery / collection point</label><select id="delivery"><option>UCC Science Market</option><option>Valco Hall</option><option>Atlantic Hall</option><option>Casford Hall</option><option>Oguaa Hall</option><option>Meet seller (agree in chat)</option></select></div><div class="field" style="margin-top:14px"><label>Payment method</label><select id="payment"><option>MTN Mobile Money</option><option>Telecel Cash</option><option>Payment on delivery</option></select></div><div class="notice">Demo checkout only. No mobile money prompt or real payment will occur.</div><button class="btn teal" onclick="completeCheckout(${total})">Place demo order</button>`})}
function completeCheckout(total){let method=$('#payment').value;state.orders.push({title:state.cart.length+' item(s) purchased',price:total,status:'Demo order placed',method,date:new Date().toLocaleDateString(),icon:'🛍️'});state.cart=[];count();persist();closeModal();nav('orders');toast('Demo order placed')}
render();count();if(state.user)$('#avatar').textContent=state.user.name[0].toUpperCase();
</script></body></html>
