<style id="uniease-design-system">
:root{
  --navy:#12324a;--navy2:#1b4963;--teal:#0e9f7d;--mint:#eaf7f2;
  --ink:#172b3a;--muted:#697d8c;--line:#e4ebef;--bg:#f4f7f8;
  --surface:#fff;--surface-soft:#f7fafb;--focus:rgba(14,159,125,.18);
  --shadow-sm:0 2px 8px rgba(18,50,74,.04);
  --shadow-md:0 12px 30px rgba(18,50,74,.09);
  --radius-sm:12px;--radius-md:16px;--radius-lg:22px;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);letter-spacing:-.01em}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px
}
.topbar{height:68px;padding-inline:max(28px,calc((100vw - 1240px)/2));box-shadow:0 1px 0 rgba(18,50,74,.03)}
.brand{gap:11px;font-size:20px;letter-spacing:-.7px}
.brandmark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--navy),#245a70);box-shadow:0 4px 10px rgba(18,50,74,.16)}
.layout{max-width:1240px;grid-template-columns:224px minmax(0,1fr);gap:28px;padding:28px 28px 88px}
.sidebar{top:88px;padding:12px;border-radius:18px;box-shadow:var(--shadow-sm)}
.side-label{padding:12px 12px 7px;letter-spacing:1.1px}
.navbtn{min-height:43px;padding:10px 12px;border-radius:11px;font-size:13px;transition:background-color 150ms ease,color 150ms ease}
.navbtn:hover{background:#f1f7f5}
.navbtn.active{background:#e8f6f1;color:#087d63}
.navico{flex:0 0 22px;font-size:17px}
.side-note{line-height:1.55;margin:18px 4px 4px;padding:14px;border:1px solid #e8eff2;background:#f6f9fa;border-radius:13px}
.main{min-width:0;max-width:100%}
.welcome{min-height:250px;padding:34px 36px;border-radius:var(--radius-lg);background:linear-gradient(115deg,#12324a 0%,#174761 58%,#176b6c 120%);box-shadow:0 14px 34px rgba(18,50,74,.13)}
.welcome:after{right:-45px;top:-132px;width:290px;height:290px;border-width:48px}
.welcome h1{font-size:clamp(28px,3vw,36px);line-height:1.13;letter-spacing:-1.1px;margin:10px 0 9px}
.welcome p{font-size:14px;line-height:1.65;max-width:490px;color:#d2e1e8}
.eyebrow{font-size:10px;letter-spacing:1.6px}
.searchbar{max-width:620px;margin-top:23px;min-height:50px;border-radius:12px;box-shadow:0 4px 16px rgba(4,24,36,.12)}
.searchbar input{font-size:13px;min-width:0}
.sectionhead{align-items:center;gap:16px;margin:30px 0 14px}
.sectionhead h2{font-size:18px;line-height:1.3;letter-spacing:-.45px}
.sub{font-size:12px;line-height:1.5;color:#718391}
.textbtn{font-size:12px;padding:8px 0;white-space:nowrap}
.services{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.service{
  min-width:0;min-height:142px;height:100%;padding:17px 16px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
  border:1px solid #e5ecef;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow-sm);text-align:left;
  transition:transform 160ms var(--ease-out),box-shadow 160ms ease,border-color 160ms ease;
}
.service:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#b9e2d5}
.service:active,.btn:active{transform:scale(.98)}
.service .ico{width:42px;height:42px;flex:none;margin:0 0 13px;border-radius:12px;font-size:19px}
.service b{font-size:13px;line-height:1.35;letter-spacing:-.15px}
.service small{font-size:11px;line-height:1.45;margin-top:4px;color:#748491}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.product{height:100%;display:flex;flex-direction:column;border-radius:16px;border-color:#e5ecef;box-shadow:var(--shadow-sm);transition:transform 160ms var(--ease-out),box-shadow 160ms ease}
.product:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.product-img{height:150px;flex:none}
.product-body{flex:1;display:flex;flex-direction:column;align-items:stretch;padding:14px}
.product-body h3{font-size:13px;line-height:1.4;min-height:36px}
.product-body .row{margin-top:auto;align-items:center}
.price{font-size:15px;letter-spacing:-.25px}
.btn{min-height:40px;padding:10px 15px;border-radius:10px;font-size:12px;letter-spacing:0;transition:background-color 150ms ease,transform 120ms ease,box-shadow 150ms ease}
.btn:hover{box-shadow:0 4px 10px rgba(18,50,74,.12)}
.btn.teal{background:var(--teal)}
.btn.teal:hover{background:#0b896d}
.btn.light{background:#eaf6f1;color:#087d63}
.btn.outline{border-color:#dce6eb}
.btn.small{min-height:34px;padding:8px 11px}
.panel{padding:22px;border-radius:17px;border-color:#e5ecef;box-shadow:var(--shadow-sm)}
.page-title{align-items:center;margin-bottom:20px}
.page-title h1{font-size:25px;line-height:1.2;letter-spacing:-.75px}
.page-title p{font-size:13px;line-height:1.55}
.tabs{gap:8px;margin:17px 0}
.tab{min-height:35px;padding:8px 13px;font-size:11px;transition:background-color 140ms ease,border-color 140ms ease,color 140ms ease}
.tab.active{background:#e8f6f1;border-color:#c8e8dc;color:#087d63}
.servicehero{min-height:100px;padding:20px 22px;border:1px solid #e1eee9;border-radius:16px;background:linear-gradient(110deg,#f0f8f5,#f6faf9)}
.servicehero .bigico{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);font-size:25px}
.servicehero h2{font-size:17px;letter-spacing:-.35px}
.servicehero p{font-size:12px;line-height:1.55}
.formgrid{gap:16px}
.field{gap:7px}
.field label{font-size:11px;letter-spacing:.1px}
.field input,.field select,.field textarea{min-height:42px;border-color:#dfe7eb;border-radius:10px;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#54bda1;box-shadow:0 0 0 3px var(--focus)}
.listrow{gap:14px;padding:14px 0}
.thumb{border-radius:12px}
.footer{padding:28px 0 12px;color:#8796a0}
.modal{border-radius:18px}
.close{transition:background-color 140ms ease,transform 140ms ease}
.close:hover{background:#e7eef1;transform:scale(1.04)}
.mobile-nav{box-shadow:0 -5px 18px rgba(18,50,74,.06);padding-top:10px}
.mobile-nav button{min-width:54px;font-weight:650}
.mobile-nav button.active{color:#087d63}
@media(max-width:1000px){
 .layout{grid-template-columns:1fr;gap:0;padding:20px 20px 94px}
 .sidebar{display:none}
 .services{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .topbar{padding-inline:20px}
}
@media(max-width:600px){
 .topbar{height:62px;padding-inline:15px}
 .layout{padding:16px 14px 94px}
 .welcome{min-height:0;padding:25px 21px;border-radius:18px}
 .welcome h1{font-size:27px;letter-spacing:-.8px}
 .welcome p{font-size:12px;max-width:290px}
 .searchbar{margin-top:19px;gap:8px;padding-inline:11px}
 .searchbar input{font-size:12px}
 .sectionhead{margin:25px 0 12px;align-items:center}
 .sectionhead h2{font-size:16px}
 .services{gap:10px}
 .service{min-height:132px;padding:14px 13px}
 .service .ico{width:38px;height:38px;margin-bottom:10px}
 .service b{font-size:12px}
 .service small{font-size:10px}
 .grid{gap:10px}
 .product-img{height:116px}
 .product-body{padding:10px}
 .product-body h3{font-size:11px;min-height:31px}
 .product-body .row{gap:5px;align-items:flex-end}
 .price{font-size:13px}
 .page-title{align-items:flex-start;gap:10px}
 .page-title h1{font-size:22px}
 .page-title p{font-size:12px}
 .panel{padding:15px}
 .servicehero{padding:15px;gap:12px}
 .servicehero .bigico{width:42px;height:42px;font-size:22px}
 .servicehero h2{font-size:15px}
 .formgrid{grid-template-columns:1fr;gap:13px}
 .field.full{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>


<style id="uniease-mobile-native">

html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;scroll-padding-top:76px}

button{-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.main,.panel,.product,.service,.listrow,.details{min-width:0}
.details b,.details .muted,.product-body h3{overflow-wrap:anywhere}

.mobile-nav button span{display:block;line-height:1.1;font-size:17px}
.mobile-nav button small{display:block;font-size:9px;line-height:1.2;white-space:nowrap}
.btn,.tab,.navbtn,.close,.mobile-nav button{touch-action:manipulation}
.service:active,.product:active,.btn:active,.navbtn:active,.mobile-nav button:active,.close:active{transform:scale(.98)}

@media(hover:hover) and (pointer:fine){
 .service:hover,.product:hover{transform:translateY(-2px)}

}

@media(max-width:1000px){

   background:rgba(255,255,255,.97);border-top:1px solid var(--line);
   box-shadow:0 -5px 18px rgba(18,50,74,.06);
   -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
 }
 .mobile-nav button{font-size:9px;color:#6b7b87}
 .mobile-nav button.active{color:#087d63}
 .mobile-nav button:focus-visible{outline-offset:-2px;border-radius:9px}
 .sidebar{display:none}
 .layout{grid-template-columns:minmax(0,1fr);gap:0}
 .main{width:100%;max-width:100%;min-width:0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .services{grid-template-columns:repeat(2,minmax(0,1fr))}
 .panel>.row{flex-wrap:wrap;align-items:stretch}
 .panel>.row>input{width:100%!important;max-width:none!important;min-width:0}
 .page-title{flex-wrap:wrap}
 .page-title>.btn{flex:none}
 .listrow{align-items:flex-start;flex-wrap:wrap}
 .listrow .details{min-width:0}
 .listrow>.btn{flex:none}
 .modalback{place-items:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
 .modal{width:min(520px,100%);max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:18px}
}

function uiIcon(name){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">'+(iconPaths[name]||iconPaths.package)+'</svg>'}
function hydrateIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=uiIcon(el.dataset.icon);el.setAttribute('aria-hidden','true')})}

function money(n){return 'GH₵ '+Number(n).toFixed(2)}
function toggleSidebar(){const app=document.querySelector('.app');if(app.classList.contains('sidebar-open'))closeSidebar();else{app.classList.add('sidebar-open');document.body.classList.add('drawer-open');$('#sidebarToggle').setAttribute('aria-expanded','true');$('#sidebarToggle').setAttribute('aria-label','Close navigation');$('#sidebar .navbtn')?.focus({preventScroll:true});}}
function closeSidebar(returnFocus=true){const app=document.querySelector('.app');if(!app)return;app.classList.remove('sidebar-open');document.body.classList.remove('drawer-open');const toggle=$('#sidebarToggle');if(toggle){toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation');if(returnFocus)toggle.focus({preventScroll:true});}}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.querySelector('.app.sidebar-open'))closeSidebar(true)});
window.addEventListener('resize',()=>{if(window.innerWidth>1000)closeSidebar(false)});
function nav(page){closeSidebar(false);state.page=page;state.filter='All';state.search='';render();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));

function toast(msg){const t=document.createElement('div');t.className='app-toast';t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>{t.classList.add('toast-leave');setTimeout(()=>t.remove(),240)},2300)}
function asset(path){if(!path)return '';if(/^https?:\/\//i.test(path)||/^data:image\//i.test(path))return path;return './'+path.split('/').map(encodeURIComponent).join('/')}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function card(item,kind='market'){
const hasPrice=item.price!==null&&item.price!==undefined&&item.price!==''&&Number.isFinite(Number(item.price));
const priceText=item.priceLabel||(hasPrice?money(item.price):'Price on request');
const title=escapeHtml(item.title||'');
const category=escapeHtml(item.cat||item.kind||'');
const sellerText=escapeHtml(item.owner||item.person||'');
const detailText=escapeHtml(item.condition||item.desc||'');
const imageUrl=item.image?escapeHtml(asset(item.image)):'';
const imageAlt=escapeHtml(item.imageAlt||item.title||'Product photo');
const placeholder=escapeHtml(item.emoji||'📦');
const photo=imageUrl?'<img class="product-photo" src="'+imageUrl+'" alt="'+imageAlt+'" width="720" height="540" loading="lazy" decoding="async" onerror="this.hidden=true">':'';

 const total=state.cart.reduce((a,x)=>a+Number(x.price),0),itemCount=state.cart.length;
 const body='<div class="security-panel checkout-security"><div class="security-shield" data-icon="shield"></div><div><b>uniEase payment safety checkpoint</b><p>Review the amount and collection point before continuing. This is a simulated checkout; no live payment provider is connected.</p></div></div>'+
 '<div class="security-control-grid"><div><span class="security-control-icon">✓</span><b>Amount shown first</b><small>The total is displayed before confirmation.</small></div><div><span class="security-control-icon">✓</span><b>No PIN or OTP fields</b><small>uniEase will never ask you to type your MoMo PIN or one-time password here.</small></div><div><span class="security-control-icon">✓</span><b>No card data collected</b><small>This prototype does not request or store payment credentials.</small></div><div><span class="security-control-icon">i</span><b>Demo data storage</b><small>Order/profile data is saved in this browser, not a protected central account database.</small></div></div>'+
 '<div class="checkout-summary"><div><span>Items</span><b>'+itemCount+'</b></div><div><span>Order total</span><b>'+money(total)+'</b></div></div>'+
 '<div class="field" style="margin-top:14px"><label>Delivery / collection point</label><select id="delivery"><option>UCC Science Market</option><option>Valco Hall</option><option>Atlantic Hall</option><option>Casford Hall</option><option>Oguaa Hall</option><option>Meet seller (agree in chat)</option></select></div>'+
 '<div class="field" style="margin-top:14px"><label>Payment provider / method (simulation)</label><select id="payment"><option value="MTN Mobile Money (demo)">MTN Mobile Money · demo</option><option value="Telecel Cash (demo)">Telecel Cash · demo</option><option value="Cash at collection (demo)">Cash at collection · demo</option></select></div>'+
 '<div class="demo-boundary"><b>Payment simulation — no funds will move</b><p>The next screen animates a provider hand-off for demonstration. No MoMo prompt is sent, no payment is authorised and no credentials are collected.</p></div>'+
 '<label class="checkout-consent"><input type="checkbox" id="demoPaymentConsent"> I understand this is a demonstration and no payment will be processed.</label>'+
 '<button class="btn teal" style="margin-top:14px" type="button" onclick="startDemoPayment('+total+')">Continue to secure demo checkout</button>';
 modal({title:'Review & payment method',body});
}
function startDemoPayment(total){
 if(!$('#demoPaymentConsent')?.checked){toast('Please acknowledge the demo payment notice');return}
 const method=$('#payment')?.value||'Payment method demo',delivery=$('#delivery')?.value||'Collection point to confirm';
 const reference='UE-DEMO-'+Date.now().toString().slice(-8),pending={total,method,delivery,reference,itemCount:state.cart.length};
 modal({title:'Payment provider · demo connection',body:paymentFlowMarkup(pending)});runDemoPayment(pending);
}
function paymentFlowMarkup(p){
 return '<div class="payment-flow" role="status"><div class="payment-provider-banner"><span class="payment-provider-icon">↗</span><div><b>'+escapeHtml(p.method)+'</b><small>Provider hand-off preview · not connected</small></div><span class="demo-stamp">SIMULATION</span></div>'+
 '<div class="payment-amount"><small>Amount being reviewed</small><b>'+money(p.total)+'</b></div><div class="payment-progress"><span id="paymentProgressBar"></span></div>'+
 '<div class="payment-stages"><div class="payment-stage active" id="paymentStage1"><span>1</span><div><b>Checking order summary</b><small>Confirming the demo amount and item count</small></div></div><div class="payment-stage" id="paymentStage2"><span>2</span><div><b>Showing provider hand-off</b><small>No external payment request is sent</small></div></div><div class="payment-stage" id="paymentStage3"><span>3</span><div><b>Preparing demo receipt</b><small>Recording a non-payment demonstration</small></div></div></div>'+
 '<div class="demo-boundary"><b>No payment credentials requested</b><p>Never share a Mobile Money PIN, banking password or OTP with uniEase. A real payment must be authorised only inside the official provider flow after secure integration is installed.</p></div>'+
 '<div id="paymentFinish" class="payment-finish" hidden><div class="receipt-check">✓</div><b>Demo checkout flow completed</b><p>No payment was processed and no money was transferred. This is a local demonstration receipt only.</p><div class="demo-reference">'+escapeHtml(p.reference)+'</div></div></div>';
}
function runDemoPayment(p){
 [1,2,3].forEach((stage,index)=>setTimeout(()=>{
  if(!document.querySelector('.payment-flow'))return;
  [1,2,3].forEach(n=>$('#paymentStage'+n)?.classList.toggle('active',n===stage));
  for(let n=1;n<stage;n++)$('#paymentStage'+n)?.classList.add('complete');
  const bar=$('#paymentProgressBar');if(bar)bar.style.width=[22,68,100][index]+'%';
  if(stage===3){const finish=$('#paymentFinish');if(finish){finish.hidden=false;finish.classList.add('finish-visible')}finishDemoPayment(p)}
 },620*(index+1)));
}
function finishDemoPayment(p){
 const items=state.cart.map(item=>{
  const gross=Number(item.price)||0,fee=Math.round(gross*.05*100)/100;
  return {title:item.title,price:gross,category:item.cat||item.kind||'',sellerId:item.sellerId||null,sellerName:item.sellerName||item.owner||'Campus catalogue',commissionRate:.05,commissionAmount:fee,sellerNet:Math.round((gross-fee)*100)/100};
 });
 const grossAmount=Math.round(items.reduce((sum,item)=>sum+item.price,0)*100)/100,commissionAmount=Math.round(items.reduce((sum,item)=>sum+item.commissionAmount,0)*100)/100,reference=p.reference;
 state.orders.push({id:reference,orderType:'Marketplace purchase · demo',isMarketplacePurchase:true,items,grossAmount,commissionRate:.05,commissionAmount,sellerPayout:Math.round((grossAmount-commissionAmount)*100)/100,title:p.itemCount+' item(s) checkout demonstration',price:grossAmount,status:'Demo purchase recorded — no funds collected',method:p.method+' · simulation only',delivery:p.delivery,reference,date:new Date().toLocaleDateString(),createdAt:new Date().toISOString(),customerName:state.user?.name||'Guest student',customerPhone:state.user?.phone||'',icon:'🛍️',paymentStatus:'Not paid · demo only'});
 state.cart=[];count();persist();
 setTimeout(()=>{if(!document.querySelector('.payment-flow'))return;closeModal();nav('orders');toast('Demo purchase recorded · commission preview updated')},1900);
}

render();count();if(state.user)$('#avatar').textContent=state.user.name[0].toUpperCase();
</script></body></html>
